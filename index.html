<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title> '<3 Ф Горемашин GOREMACHINE '<3 </title>
        <link rel="stylesheet" href="/css/main.css">
        <script src="/js/symbol.js"></script>
        <script src="/js/titlescroll.js"></script>
        <script src="/js/cross.js"></script>
        <script src="/js/main.js"></script>
        <script src="js/navigation.js" defer></script>
        <script src="/js/calendar.js" defer></script>
        <link rel="icon" type="image/x-icon" href="/assets/ico.png">
    </head>
    <body>
        <div class="wrapper">
            <img src="/assets/overlay.jpg" class="overlay overlay-1" alt="Overlay Image">
            <img src="/assets/overlay2.jpg" class="overlay overlay-2" alt="Overlay Image">
            <img src="/assets/overlay3.jpg" class="overlay overlay-3" alt="Overlay Image">

            <!-- Side content -->
            <div class="sidebar-column">
                <nav class="side-content" data-site-navigation aria-label="Main navigation"></nav>

                <section class="calendar" aria-label="Calendar">
                    <div class="calendar-header">
                        <button
                            class="calendar-nav"
                            id="calendar-prev"
                            type="button"
                            aria-label="Previous month"
                        >&lt;</button>
                        <h2 id="calendar-month" aria-live="polite"></h2>
                        <button
                            class="calendar-nav"
                            id="calendar-next"
                            type="button"
                            aria-label="Next month"
                        >&gt;</button>
                    </div>
                    <div class="calendar-grid calendar-weekdays" aria-hidden="true">
                        <span>Sun</span>
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                    </div>
                    <div
                        class="calendar-grid"
                        id="calendar-days"
                        role="grid"
                        aria-label="Days of the month"
                    ></div>
                </section>
            </div>

            <!-- Main content -->
            <main class="main-content">
                <h1>GOREMACHINE</h1>
                <p>Welcome to my epic revamped website :3 <br></p>

                <div class="welcome-layout" style="display: flex; align-items: center; gap: 4px; line-height: 2;">
                    <img id="symbol" src="/assets/special symbol1.png" height="210px">
                    <p style="margin: 0;">
                        Very much a work in progress :) <br>
                        Hence why this website looks funny right now.
                    </p>
                </div>
            </main>
            <footer class="footer-credit">
                <p><b>&copy;Made by Light pls no steal</b></p>
            </footer>

            <img
                id="saw"
                src="/assets/saw.png"
                class="decoration-img"
                style="--spin:18s;--top: 98%; --left: 90%; --height: 55vh;"
                alt=""
            >
            <img
                id="cross"
                src="/assets/cross.png"
                class="decoration-img"
                style="--top: 8%; --left: 18%; --height: 50vh; transform: scale(1.15);"
                alt=""
            >
        </div>
    </body>
</html>
